<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nerve YouTube channel banner</title>
  <style>
    @font-face { font-family: 'Barlow Condensed'; src: url('./fonts/barlow-condensed-700-latin.woff2') format('woff2'); font-style: normal; font-weight: 700; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('./fonts/ibm-plex-mono-400-latin.woff2') format('woff2'); font-style: normal; font-weight: 400; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('./fonts/ibm-plex-mono-500-latin.woff2') format('woff2'); font-style: normal; font-weight: 500; }
    :root {
      --ground: #0b0c0a;
      --surface: #131511;
      --line: #242820;
      --ink: #edefe8;
      --ink-2: #9da396;
      --ink-3: #6a7062;
      --volt: #c4f82a;
    }
    * { box-sizing: border-box; }
    html, body { width: 2560px; height: 1440px; margin: 0; overflow: hidden; }
    body { background: var(--ground); color: var(--ink); }
    .banner { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(#20241d 1px, transparent 1px), linear-gradient(90deg, #20241d 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: .30;
    }
    .grid::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--ground) 4%, transparent 28%, transparent 78%, var(--ground) 99%);
    }
    .ring { position: absolute; border: 1px solid #2c3426; border-radius: 50%; left: 1835px; top: 720px; transform: translate(-50%, -50%); }
    .ring.a { width: 1260px; height: 1260px; opacity: .75; }
    .ring.b { width: 1060px; height: 1060px; opacity: .62; }
    .ring.c { width: 860px; height: 860px; opacity: .52; }
    .ring.d { width: 660px; height: 660px; opacity: .43; }
    .axis { position: absolute; background: #30372a; opacity: .42; }
    .axis.horizontal { left: 0; right: 0; top: 720px; height: 1px; }
    .axis.vertical { top: 0; bottom: 0; left: 1835px; width: 1px; }
    .copy { position: absolute; left: 552px; top: 536px; z-index: 2; }
    .eyebrow, .url, .meter, .tick {
      font-family: 'IBM Plex Mono', monospace;
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
    }
    .eyebrow { color: var(--ink-3); font-size: 20px; font-weight: 500; letter-spacing: .15em; }
    h1 { margin: 30px 0 0; font-family: 'Barlow Condensed', sans-serif; font-size: 190px; font-weight: 700; letter-spacing: -.015em; line-height: .82; text-transform: uppercase; }
    .tagline { margin: 34px 0 0; color: var(--ink-2); font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 700; line-height: .99; letter-spacing: .035em; text-transform: uppercase; }
    .url { margin-top: 10px; color: var(--ink-3); font-size: 19px; letter-spacing: .15em; }
    .meter { position: absolute; left: 1560px; top: 648px; z-index: 2; width: 452px; }
    .meter-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
    .meter-label { color: var(--ink-2); font-size: 19px; letter-spacing: .13em; }
    .meter-value { color: var(--volt); font-size: 58px; line-height: 1; }
    .meter-track { position: relative; height: 14px; border: 1px solid #3a4233; background: var(--surface); }
    .meter-fill { width: 65%; height: 100%; background: var(--volt); }
    .meter-marker { position: absolute; left: 65%; top: -12px; width: 1px; height: 38px; background: var(--ink-2); }
    .meter-foot { display: flex; justify-content: space-between; margin-top: 16px; font-size: 16px; color: var(--ink-3); }
    .meter-foot .armed { color: var(--ink-2); }
    .corner { position: absolute; width: 27px; height: 27px; opacity: .56; }
    .corner::before, .corner::after { content: ""; position: absolute; background: #4b5442; }
    .corner::before { left: 13px; top: 0; width: 1px; height: 27px; }
    .corner::after { left: 0; top: 13px; width: 27px; height: 1px; }
    .corner.tl { left: 128px; top: 126px; } .corner.tr { right: 128px; top: 126px; }
    .corner.bl { left: 128px; bottom: 126px; } .corner.br { right: 128px; bottom: 126px; }
    .edge-note { position: absolute; left: 160px; bottom: 124px; font: 500 16px 'IBM Plex Mono', monospace; letter-spacing: .17em; color: #5a6254; }
  </style>
</head>
<body>
  <main class="banner" aria-label="Nerve: Practise the conversations you usually avoid">
    <div class="grid"></div>
    <div class="ring a"></div><div class="ring b"></div><div class="ring c"></div><div class="ring d"></div>
    <div class="axis horizontal"></div><div class="axis vertical"></div>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="copy">
      <div class="eyebrow">CONVERSATION TRAINING</div>
      <h1>NERVE</h1>
      <p class="tagline">PRACTISE THE CONVERSATIONS<br>YOU USUALLY AVOID.</p>
      <div class="url">HELLONERVE.COM</div>
    </div>
    <div class="meter" aria-label="Warmth meter at 65, armed">
      <div class="meter-head"><span class="meter-label">WARMTH</span><span class="meter-value">65</span></div>
      <div class="meter-track"><div class="meter-fill"></div><div class="meter-marker"></div></div>
      <div class="meter-foot"><span>0</span><span class="armed">ARMED</span><span>100</span></div>
    </div>
    <div class="edge-note">PRACTICE UNDER PRESSURE.</div>
  </main>
</body>
</html>
